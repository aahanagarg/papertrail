[project]
name = "papertrail"
version = "0.1.0"
description = "RAG question-answering over research papers, with a reliability benchmark."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=2.19",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
